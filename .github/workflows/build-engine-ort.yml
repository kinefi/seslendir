name: Build engine pack (ONNX Runtime)

# Alternatif ses motoru paketi: ONNX Runtime Web + Piper modeli. Derleme gerektirmez; hazır dosyaları
# toplar, başsız Chromium'da gerçekten Türkçe konuştuğunu doğrular ve GitHub sürümü olarak yayımlar.
# Eklenti bu paketi YS_ENGINE_KIND = 'piper-ort' iken kullanır (varsayılan manifest: engine-2).
#
#   GitHub → Actions → "Build engine pack (ONNX Runtime)" → Run workflow

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Sürüm etiketi (includes/class-engine.php içindeki MANIFEST_DEFAULT_ORT ile aynı olmalı)'
        default: 'engine-2'
        required: true
      ort_version:
        description: 'onnxruntime-web sürümü (npm)'
        default: '1.22.0'
        required: true
      voice_path:
        description: 'rhasspy/piper-voices içindeki yol, uzantısız'
        default: 'tr/tr_TR/fettah/medium/tr_TR-fettah-medium'
        required: true

permissions:
  contents: write

concurrency:
  group: build-engine-ort
  cancel-in-progress: false

jobs:
  build:
    name: Collect, smoke-test and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAG: ${{ inputs.release_tag }}
      ORT_VERSION: ${{ inputs.ort_version }}
      VOICE_PATH: ${{ inputs.voice_path }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Get ONNX Runtime Web
        run: |
          mkdir -p dist ort && cd ort
          npm pack "onnxruntime-web@${ORT_VERSION}" --silent
          tar -xzf onnxruntime-web-*.tgz
          ls package/dist | head -50
          pick() { find package/dist -maxdepth 1 -name "$1" -print -quit; }
          JS="$(pick 'ort.wasm.min.js')"
          MJS="$(pick 'ort-wasm-simd-threaded.mjs')"
          WASM="$(pick 'ort-wasm-simd-threaded.wasm')"
          test -n "$JS" -a -n "$MJS" -a -n "$WASM" || { echo "::error::onnxruntime-web paketinde beklenen dosyalar yok (ort.wasm.min.js, ort-wasm-simd-threaded.mjs/.wasm). dist listesi yukarıda."; exit 1; }
          cp "$JS" ../dist/ort.wasm.min.js
          cp "$MJS" ../dist/ort-wasm-simd-threaded.js
          cp "$WASM" ../dist/ort-wasm-simd-threaded.wasm

      - name: Get the Piper voice
        run: |
          BASE="https://huggingface.co/rhasspy/piper-voices/resolve/main/${VOICE_PATH}"
          curl -fL --retry 3 -o dist/voice.onnx "${BASE}.onnx"
          curl -fL --retry 3 -o dist/voice.onnx.json "${BASE}.onnx.json"
          python3 - <<'PY'
          import json
          c = json.load(open('dist/voice.onnx.json', encoding='utf-8'))
          assert 'phoneme_id_map' in c and '^' in c['phoneme_id_map'], 'phoneme_id_map eksik'
          print('örnekleme hızı:', c.get('audio', {}).get('sample_rate'), 'konuşmacı:', c.get('num_speakers'), 'espeak:', c.get('espeak', {}).get('voice'))
          PY
          ls -la dist

      - name: Get the piper-phonemize WebAssembly bundle
        run: |
          curl -fsSL -o pp.zip https://github.com/csukuangfj/piper-phonemize/releases/download/wasm/piper-phonemize-v1.6.1-wasm-browser.zip
          echo "31851c373df9761fb1eb3f000abf939e1eec7e63b1821ca6a0c4b3902c7b9e46  pp.zip" | sha256sum -c -
          unzip -q pp.zip
          for f in piper-phonemize.js piper-phonemize-wasm-main.js piper-phonemize-wasm-main.wasm piper-phonemize-wasm-main.data; do
            test -f "browser/$f" || { echo "::error::Fonemleştirici paketinde $f yok."; exit 1; }
            cp "browser/$f" "dist/$f"
          done

      - name: Add the optional MP3 encoder (lamejs, LGPL)
        run: |
          mkdir lame && cd lame
          npm pack lamejs --silent || true
          tar -xzf lamejs-*.tgz 2>/dev/null || true
          LAME="$(find . -name 'lame.min.js' -print -quit)"
          if [ -n "$LAME" ]; then cp "$LAME" ../dist/lame.min.js; echo "lame.min.js eklendi"; else echo "::warning::lame.min.js bulunamadı; ses WAV olarak kaydedilecek."; fi

      - name: Smoke test (headless Chromium speaks Turkish with the pack)
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node tools/engine-smoke.mjs dist piper-ort

      - name: Manifest and manual-install zip
        run: |
          python3 tools/make-engine-manifest.py dist "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/" --engine piper-ort --voice "$(basename "$VOICE_PATH")"
          (cd dist && zip -q ../yaziyi-seslendir-motor-ort.zip ort* voice.onnx voice.onnx.json piper-phonemize* $(ls lame.min.js 2>/dev/null))
          mv yaziyi-seslendir-motor-ort.zip dist/
          ls -la dist
          cat dist/engine-manifest.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Yazıyı Seslendir motor paketi (ONNX Runtime Web ${ORT_VERSION} + Piper ${VOICE_PATH##*/}). wp-config.php içinde define( 'YS_ENGINE_KIND', 'piper-ort' ); ile kullanılır; yaziyi-seslendir-motor-ort.zip elle kurulum içindir."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Motor paketi, ONNX Runtime ($TAG)" --notes "$NOTES" --latest=false
          fi
