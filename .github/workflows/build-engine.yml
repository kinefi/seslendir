name: Build engine pack

# Türkçe ses motoru paketini derler, başsız Chromium'da gerçekten konuştuğunu doğrular ve
# GitHub sürümü olarak yayımlar. Eklentinin "Otomatik indir" düğmesi bu sürümü indirir.
#
#   GitHub → Actions → "Build engine pack" → Run workflow
#
# Paket yalnızca motor ya da ses değiştiğinde yeniden üretilir; eklenti sürümlerinden bağımsızdır.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Sürüm etiketi (includes/class-engine.php içindeki MANIFEST_DEFAULT ile aynı olmalı)'
        default: 'engine-1'
        required: true
      sherpa_ref:
        description: 'sherpa-onnx dalı ya da etiketi (örn. master, v1.12.15)'
        default: 'master'
        required: true
      emsdk_version:
        description: 'Emscripten SDK sürümü'
        default: 'latest'
        required: true
      voice_repo:
        description: 'Hugging Face ses deposu (Piper/VITS biçimi: .onnx, tokens.txt, espeak-ng-data/)'
        default: 'csukuangfj/vits-piper-tr_TR-fettah-medium'
        required: true

permissions:
  contents: write

concurrency:
  group: build-engine
  cancel-in-progress: false

jobs:
  build:
    name: Build, smoke-test and publish
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TAG: ${{ inputs.release_tag }}
      SHERPA_REF: ${{ inputs.sherpa_ref }}
      EMSDK_VERSION: ${{ inputs.emsdk_version }}
      VOICE_REPO: ${{ inputs.voice_repo }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          cd "$HOME/emsdk"
          ./emsdk install "$EMSDK_VERSION"
          ./emsdk activate "$EMSDK_VERSION"

      - name: Get sherpa-onnx
        run: git clone --depth 1 --branch "$SHERPA_REF" https://github.com/k2-fsa/sherpa-onnx.git sherpa-onnx

      - name: Get the Turkish voice
        run: |
          git lfs install
          git clone --depth 1 "https://huggingface.co/${VOICE_REPO}" voice
          ls -la voice
          test -d voice/espeak-ng-data || { echo "::error::Ses deposunda espeak-ng-data/ yok. sherpa-onnx biçiminde bir Piper deposu gerekir."; exit 1; }
          test -f voice/tokens.txt || { echo "::error::Ses deposunda tokens.txt yok."; exit 1; }

      - name: Stage the voice as the WebAssembly TTS assets
        run: |
          ASSETS=sherpa-onnx/wasm/tts/assets
          mkdir -p "$ASSETS"
          find "$ASSETS" -mindepth 1 -not -name 'README.md' -exec rm -rf {} +
          MODEL="$(ls voice/*.onnx | head -n1)"
          echo "model: $MODEL"
          cp "$MODEL" "$ASSETS/model.onnx"
          cp voice/tokens.txt "$ASSETS/tokens.txt"
          cp -r voice/espeak-ng-data "$ASSETS/espeak-ng-data"
          ls -la "$ASSETS"
          if ! grep -q "model.onnx" sherpa-onnx/wasm/tts/sherpa-onnx-tts.js; then
            echo "::warning::sherpa-onnx-tts.js varsayılan yapılandırması model.onnx'i göstermiyor olabilir; duman testi bunu yakalar."
          fi

      - name: Build the WebAssembly TTS
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          cd sherpa-onnx
          ls build-wasm*tts*.sh
          ./build-wasm-simd-tts.sh

      - name: Collect the engine files
        run: |
          mkdir dist
          for f in sherpa-onnx-tts.js sherpa-onnx-wasm-main-tts.js sherpa-onnx-wasm-main-tts.wasm sherpa-onnx-wasm-main-tts.data; do
            SRC="$(find sherpa-onnx -path '*build-wasm*' -name "$f" -print -quit)"
            if [ -z "$SRC" ] && [ "$f" = "sherpa-onnx-tts.js" ]; then SRC="sherpa-onnx/wasm/tts/sherpa-onnx-tts.js"; fi
            test -n "$SRC" -a -f "$SRC" || { echo "::error::Derleme çıktısında $f bulunamadı."; exit 1; }
            cp "$SRC" "dist/$f"
          done
          ls -la dist

      - name: Add the optional MP3 encoder (lamejs, LGPL)
        run: |
          mkdir lame && cd lame
          npm pack lamejs --silent || true
          tar -xzf lamejs-*.tgz 2>/dev/null || true
          LAME="$(find . -name 'lame.min.js' -print -quit)"
          if [ -n "$LAME" ]; then cp "$LAME" ../dist/lame.min.js; echo "lame.min.js eklendi"; else echo "::warning::lame.min.js bulunamadı; ses WAV olarak kaydedilecek."; fi

      - name: Smoke test (headless Chromium speaks Turkish with the pack)
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node tools/engine-smoke.mjs dist

      - name: Manifest and manual-install zip
        run: |
          python3 tools/make-engine-manifest.py dist "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/" --voice "$(basename "$VOICE_REPO")"
          (cd dist && zip -q ../yaziyi-seslendir-motor.zip sherpa-onnx-* $(ls lame.min.js 2>/dev/null))
          mv yaziyi-seslendir-motor.zip dist/
          ls -la dist
          cat dist/engine-manifest.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Yazıyı Seslendir motor paketi (${VOICE_REPO}, sherpa-onnx ${SHERPA_REF}). Eklentinin Kurulum sekmesindeki Otomatik indir düğmesi bu dosyaları indirir; yaziyi-seslendir-motor.zip elle kurulum içindir."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Motor paketi ($TAG)" --notes "$NOTES" --latest=false
          fi
